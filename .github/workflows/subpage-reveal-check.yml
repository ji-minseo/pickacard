name: Subpage Reveal Branch Check

on:
  push:
    branches: ["fix/subpage-reveal-sequences"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
